<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Group Management</title>

    <link rel="stylesheet"
          href="group-management.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <div>
            <h1>Group Management</h1>
            <p>Manage groups and their members</p>
        </div>

        <button id="logoutButton" class="logout-button">
            Logout
        </button>

    </header>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="container">

        <!-- TOP SECTION -->

        <div class="page-top">

            <div>
                <h2>Groups</h2>
                <p>View and manage all groups</p>
            </div>

            <button id="addGroupButton" class="primary-button">
                + Create Group
            </button>

        </div>


        <!-- =========================
             GROUP FORM
        ========================== -->

        <div id="groupFormContainer"
             class="form-container hidden">

            <h3 id="formTitle">Create Group</h3>

            <form id="groupForm">

                <input type="hidden"
                       id="groupId">

                <div class="form-group">

                    <label for="groupName">
                        Group Name
                    </label>

                    <input type="text"
                           id="groupName"
                           placeholder="Enter group name"
                           required>

                </div>


                <div class="form-group">

                    <label for="groupDescription">
                        Description
                    </label>

                    <textarea id="groupDescription"
                              placeholder="Enter group description"
                              rows="4"></textarea>

                </div>


                <div class="form-group">

                    <label for="groupStatus">
                        Status
                    </label>

                    <select id="groupStatus">

                        <option value="Active">
                            Active
                        </option>

                        <option value="Inactive">
                            Inactive
                        </option>

                    </select>

                </div>


                <div class="form-actions">

                    <button type="submit"
                            class="primary-button">
                        Save Group
                    </button>

                    <button type="button"
                            id="cancelGroupButton"
                            class="secondary-button">
                        Cancel
                    </button>

                </div>

            </form>

        </div>


        <!-- =========================
             GROUP LIST
        ========================== -->

        <section class="groups-section">

            <div id="loadingMessage"
                 class="message">
                Loading groups...
            </div>

            <div id="errorMessage"
                 class="message error hidden">
            </div>

            <div id="groupsContainer"
                 class="groups-container">
            </div>

        </section>

    </main>

<!-- Member Management Modal -->

<div id="memberModal" class="modal hidden">

    <div class="modal-content">

        <div class="modal-header">

            <div>
                <h2 id="memberModalTitle">
                    Group Members
                </h2>

                <p id="memberModalSubtitle">
                    Manage group members
                </p>
            </div>

            <button id="closeMemberModal"
                    class="close-button">
                &times;
            </button>

        </div>

        <div class="modal-body">

            <h3>Current Members</h3>

            <div id="membersList"
                 class="members-list">

                <p class="member-empty">
                    No members found.
                </p>

            </div>

            <hr>

            <h3>Add Member</h3>

            <div class="add-member-section">

                <select id="userSelect">

                    <option value="">
                        Select a user
                    </option>

                </select>

                <button id="addMemberButton"
                        class="primary-button">
                    + Add Member
                </button>

            </div>

            <div id="memberMessage"
                 class="message hidden">
            </div>

        </div>

    </div>

</div>
    <script src="group-management.js"></script>

</body>

</html>
