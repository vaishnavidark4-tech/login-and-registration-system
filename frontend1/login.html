<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | User Management</title>

    <link rel="stylesheet" href="login.css">

</head>

<body>

    <div class="page">

        <!-- LEFT SIDE -->

        <section class="welcome-section">

            <div class="welcome-content">

                <div class="logo">
                    UM
                </div>

                <h1>User Management</h1>

                <p>
                    Manage your users easily,
                    securely and efficiently.
                </p>

                <div class="features">

                    <div class="feature">
                        <span>✓</span>
                        <p>Manage user accounts</p>
                    </div>

                    <div class="feature">
                        <span>✓</span>
                        <p>Edit user information</p>
                    </div>

                    <div class="feature">
                        <span>✓</span>
                        <p>Delete users easily</p>
                    </div>

                </div>

            </div>

        </section>


        <!-- RIGHT SIDE -->

        <section class="login-section">

            <div class="login-card">

                <div class="mobile-logo">
                    UM
                </div>

                <h2>Welcome Back</h2>

                <p class="login-subtitle">
                    Login to your account
                </p>


                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                    >

                </div>


                <p id="message" class="message"></p>


                <button
                    id="loginButton"
                    class="login-button"
                >
                    Login
                </button>


                <p class="footer-text">
                    User Management System
                </p>

            </div>

        </section>

    </div>


    <!-- LOGIN JAVASCRIPT -->

   
<script>

    const loginButton =
        document.getElementById("loginButton");

    loginButton.addEventListener("click", async function () {

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value.trim();

        const message =
            document.getElementById("message");


        // ==========================================
        // DEBUG - CHECK EXACT VALUES
        // ==========================================

        console.log("================================");
        console.log("LOGIN BUTTON CLICKED");
        console.log("EMAIL =", email);
        console.log("EMAIL LENGTH =", email.length);
        console.log("PASSWORD LENGTH =", password.length);
        console.log("================================");


        // ==========================================
        // VALIDATION
        // ==========================================

        if (email === "") {

            message.textContent =
                "Please enter your email.";

            return;
        }


        if (password === "") {

            message.textContent =
                "Please enter your password.";

            return;
        }


        loginButton.disabled = true;

        loginButton.textContent =
            "Logging in...";

        message.textContent = "";


        try {

            // ==========================================
            // SEND LOGIN REQUEST
            // ==========================================

            const response = await fetch(
    "https://login-and-registration-system-new.onrender.com/api/auth/login",
    {
                
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );


            const text =
                await response.text();


            console.log("================================");
            console.log("SERVER STATUS =", response.status);
            console.log("SERVER RESPONSE =", text);
            console.log("================================");


            if (!response.ok) {

                message.textContent =
                    "Login failed: " + text;

                loginButton.disabled = false;

                loginButton.textContent =
                    "Login";

                return;
            }


            // ==========================================
            // LOGIN SUCCESS
            // ==========================================

            localStorage.setItem(
                "loggedInUser",
                text
            );


            console.log("LOGIN SUCCESS");


            window.location.href =
                "./user-management.html";

        }


        catch (error) {

            console.error(
                "LOGIN ERROR:",
                error
            );

            message.textContent =
                "Cannot connect to Spring Boot.";

            loginButton.disabled = false;

            loginButton.textContent =
                "Login";
        }

    });

</script>



</body>

</html>
